<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>collab</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- AI code -->
    <svg width="0" height="0" style="position:absolute">
        <filter id="filter" color-interpolation-filters="sRGB">
            <feFlood id="filter-colour" flood-color="#ffffff00" result="c" />
            <feComposite in="c" in2="SourceAlpha" operator="in" />
        </filter>
    </svg>
    <!--  -->

    <div id="imgs">
        <img src="/private.png" id="private-img" alt="">
        <img src="/public.png" id="public-img" alt="">
    </div>

    <div id="account">
        <img src="/account.png" alt="">
        <span id="name"></span>
        <button id="auth-btn"><img src="/login.png" alt=""></button>
        <button id="logout-btn"><img src="/logout.png" alt=""></button>
    </div>

    <div id="host-div">
        <span>host</span>
        <select name="hosts" id="hosts"></select>
    </div>


    <div class="page" id="main">
        <div class="btns">
            <button id="rooms-btn">Rooms</button>
            <button id="projects-btn">Projects</button>
        </div>
    </div>

    <div class="page" id="rooms">
        <h2>Rooms</h2>
        <div class="btns">
            <button class="back-btn" id="rooms-back-btn">Back</button>
            <button id="new-room-btn">New Room</button>
        </div>

        <div class="list-div" id="public-rooms">
            <h3>Public Rooms</h3>
            <!-- <div class="list-tools">
                <input class="tools-search" id="rooms-search" placeholder="search rooms" type="text">
            </div> -->
            <div class="list" id="public-rooms-list"></div>
        </div>

        <!-- <p>To join private rooms, first open their invite links and then open in vscode.</p> -->
    </div>

    <div class="page" id="room">
        <div class="title">
            <h2 id="room-title"></h2>
            <div id="room-visibility"></div>
            <button id="room-invite-btn"><img src="/invite.png" alt=""></button>
        </div>

        <div class="btns">
            <button class="back-btn" id="leave-room-btn">Leave Room</button>
        </div>
        <div class="users-list list" id="room-users"></div>
    </div>

    <div class="page" id="projects">
        <h2>Projects</h2>

        <div class="btns">
            <button class="back-btn" id="projects-back-btn">Back</button>
            <button id="new-project-btn">New Project</button>
            <p id="new-project-guest">Login to create new projects!</p>
        </div>

        <div class="list-div" id="recent-projects">
            <h3>Recent Projects</h3>
            <!-- <div class="list-tools">
                <input class="tools-search" id="recent-projects-search" placeholder="search projects" type="text">
            </div> -->
            <div class="list" id="recent-projects-list"></div>
        </div>

        <div class="list-div" id="public-projects">
            <h3>Public Projects</h3>
            <!-- <div class="list-tools">
                <input class="tools-search" id="public-projects-search" placeholder="search projects" type="text">
            </div> -->
            <div class="list" id="public-projects-list"></div>
        </div>

        <p>To open private projects, first open their invite links.</p>
    </div>

    <div class="page" id="project">
        <div class="title">
            <h2 id="project-title"></h2>
            <div id="project-visibility"></div>
            <button id="project-invite-btn"><img src="/invite.png" alt=""></button>
        </div>
        <div class="btns">
            <button class="back-btn" id="leave-project-btn">Close Project</button>
        </div>
        <div class="users-list list" id="project-users"></div>
    </div>

    <!-- <div id="btns">
        <button id="new-project">New Project</button>
    </div>

    <span id="projects-title">Projects</span>

    <div id="projects"></div> -->

    <script type="module" src="./src/main.ts"></script>
</body>

</html>
